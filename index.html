<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>exi@terminal:~$</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0d1117;
  --bg2:#161b22;
  --bg3:#1c2128;
  --border:#30363d;
  --border-bright:#58a6ff44;
  --green:#3fb950;
  --green-dim:#2ea043;
  --blue:#58a6ff;
  --blue-dim:#388bfd;
  --yellow:#e3b341;
  --red:#ff7b72;
  --purple:#d2a8ff;
  --cyan:#79c0ff;
  --white:#e6edf3;
  --gray:#8b949e;
  --gray2:#6e7681;
  --prompt-user:#3fb950;
  --prompt-host:#58a6ff;
  --prompt-path:#e3b341;
  --cursor:#3fb950;
  --scanline:rgba(0,0,0,0.04);
}

html,body{
  min-height:100%;
  font-family:'JetBrains Mono',monospace;
  background:var(--bg);
  color:var(--white);
  overflow-x:hidden;
  font-size:14px;
  line-height:1.6;
}

::selection{background:var(--blue);color:#000}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--gray2)}

.scanlines{
  position:fixed;inset:0;z-index:9999;pointer-events:none;
  background:repeating-linear-gradient(0deg,var(--scanline) 0px,var(--scanline) 1px,transparent 1px,transparent 3px);
  opacity:0.5;
}

.crt-glow{
  position:fixed;inset:0;z-index:9998;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.4) 100%);
}

#loading-screen{
  position:fixed;inset:0;z-index:1000;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;
}

#loading-screen.hidden{
  animation:fadeOut 0.6s ease forwards;
}

@keyframes fadeOut{
  to{opacity:0;pointer-events:none}
}

.boot-logo{
  font-size:clamp(18px,4vw,32px);
  color:var(--green);
  letter-spacing:0.1em;
  text-align:center;
  line-height:1.3;
  white-space:pre;
}

.boot-bar-wrap{
  width:min(320px,80vw);
  height:2px;
  background:var(--border);
  border-radius:1px;
  overflow:hidden;
}

.boot-bar{
  height:100%;
  width:0%;
  background:var(--green);
  border-radius:1px;
  transition:width 0.05s linear;
  box-shadow:0 0 8px var(--green);
}

.boot-log{
  font-size:11px;
  color:var(--gray);
  text-align:center;
  height:16px;
  letter-spacing:0.05em;
}

#terminal{
  max-width:860px;
  margin:0 auto;
  padding:16px;
  min-height:100vh;
}

.term-window{
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  background:var(--bg);
  box-shadow:0 0 0 1px rgba(255,255,255,0.03),0 0 40px rgba(63,185,80,0.04);
}

.term-titlebar{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:10px 16px;
  display:flex;align-items:center;gap:8px;
  user-select:none;
}

.term-dots{display:flex;gap:6px;}
.term-dot{width:12px;height:12px;border-radius:50%;}
.dot-red{background:#ff5f56}
.dot-yellow{background:#ffbd2e}
.dot-green{background:#27c93f}

.term-title{
  flex:1;text-align:center;
  font-size:12px;color:var(--gray);
  letter-spacing:0.05em;
}

.term-body{
  padding:20px;
  min-height:calc(100vh - 120px);
}

.line{
  margin-bottom:2px;
  white-space:pre-wrap;
  word-break:break-word;
}

.line.gap{margin-bottom:12px;}
.line.gap2{margin-bottom:20px;}

.prompt-line{display:flex;align-items:baseline;gap:0;flex-wrap:wrap;}
.p-user{color:var(--prompt-user);font-weight:700;}
.p-at{color:var(--gray);}
.p-host{color:var(--prompt-host);font-weight:700;}
.p-colon{color:var(--gray);}
.p-path{color:var(--prompt-path);}
.p-dollar{color:var(--gray);margin-right:8px;}
.p-cmd{color:var(--white);}

.c-green{color:var(--green)}
.c-blue{color:var(--blue)}
.c-yellow{color:var(--yellow)}
.c-red{color:var(--red)}
.c-purple{color:var(--purple)}
.c-cyan{color:var(--cyan)}
.c-gray{color:var(--gray)}
.c-gray2{color:var(--gray2)}
.c-white{color:var(--white)}
.c-dim{color:var(--gray2)}

.comment{color:var(--gray2);font-style:italic;}

.section-header{
  border-top:1px solid var(--border);
  padding-top:16px;
  margin-top:6px;
  margin-bottom:4px;
}

.key-val{display:flex;gap:0;flex-wrap:wrap;}
.kv-key{color:var(--cyan);min-width:160px;}
.kv-val{color:var(--white);}
.kv-link{color:var(--blue);text-decoration:underline;cursor:pointer;}
.kv-link:hover{color:var(--cyan);}

.status-dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-right:6px;vertical-align:middle;
  background:var(--gray);
  transition:background 0.4s,box-shadow 0.4s;
}
.status-dot.online{background:var(--green);box-shadow:0 0 5px var(--green);}
.status-dot.idle{background:var(--yellow);box-shadow:0 0 5px var(--yellow);}
.status-dot.dnd{background:var(--red);box-shadow:0 0 5px var(--red);}
.status-dot.offline{background:var(--gray);box-shadow:none;}

.tag-inline{
  display:inline-block;
  border:1px solid var(--border);
  color:var(--gray);
  font-size:11px;
  padding:1px 7px;border-radius:3px;
  margin-right:4px;
  vertical-align:middle;
}

.badge-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px;}
.badge-pill{
  border:1px solid var(--border-bright);
  color:var(--blue);
  font-size:11px;
  padding:2px 10px;border-radius:20px;
  letter-spacing:0.04em;
}

.fav-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:8px;
  margin-top:6px;
}

.fav-card{
  border:1px solid var(--border);
  border-radius:4px;
  padding:8px 12px;
  background:var(--bg2);
  cursor:pointer;
  transition:border-color 0.15s,background 0.15s;
  display:flex;align-items:flex-start;gap:10px;
}

.fav-card:hover{border-color:var(--green);background:var(--bg3);}

.fav-card-num{color:var(--gray2);font-size:11px;min-width:20px;padding-top:1px;}
.fav-card-body{flex:1;}
.fav-card-title{color:var(--green);font-weight:500;}
.fav-card-sub{color:var(--gray);font-size:11px;}
.fav-card-desc{color:var(--gray);font-size:12px;margin-top:4px;line-height:1.5;display:none;}
.fav-card.open .fav-card-desc{display:block;}
.fav-card-arrow{color:var(--gray2);font-size:11px;margin-top:2px;transition:transform 0.15s;}
.fav-card.open .fav-card-arrow{transform:rotate(90deg);}

.loved-list-inline{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.loved-tag{
  border:1px solid var(--border);
  color:var(--gray);font-size:12px;padding:2px 10px;border-radius:3px;
  cursor:pointer;transition:border-color 0.15s,color 0.15s;
}
.loved-tag:hover{border-color:var(--blue);color:var(--blue);}

.social-list-term{display:flex;flex-direction:column;gap:4px;margin-top:4px;}
.social-term-item{
  display:flex;align-items:center;gap:10px;
  color:var(--gray);font-size:13px;
  cursor:pointer;
  padding:2px 0;
}
.social-term-item:hover .st-name{color:var(--blue);}
.st-icon{color:var(--gray2);width:18px;text-align:center;}
.st-name{color:var(--white);transition:color 0.15s;}
.st-url{color:var(--gray2);font-size:11px;}

.cursor-blink{
  display:inline-block;width:8px;height:14px;
  background:var(--cursor);
  vertical-align:text-bottom;
  animation:blink 1s step-end infinite;
  margin-left:2px;
}

@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.typing-line{min-height:1.6em;}

.activity-wrap{
  display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;
}

.input-line{
  display:flex;align-items:baseline;gap:8px;
  margin-top:12px;padding-top:12px;
  border-top:1px solid var(--border);
  flex-wrap:wrap;
}

.cmd-input{
  background:transparent;border:none;outline:none;
  color:var(--white);font-family:'JetBrains Mono',monospace;font-size:14px;
  flex:1;min-width:120px;caret-color:var(--green);
}

.help-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:4px 16px;
  margin-top:4px;
}

.help-item{display:flex;gap:8px;}
.help-cmd{color:var(--yellow);min-width:100px;}
.help-desc{color:var(--gray);font-size:12px;}

.output-block{
  margin:8px 0;
  padding-left:4px;
  border-left:2px solid var(--border);
}

.error-line{color:var(--red);}
.success-line{color:var(--green);}

.works-empty{
  border:1px dashed var(--border);
  border-radius:4px;
  padding:10px 14px;
  color:var(--gray2);
  font-size:12px;
  margin-top:4px;
  font-style:italic;
}

.age-display{color:var(--purple);}

@media(max-width:600px){
  #terminal{padding:8px;}
  .term-body{padding:12px 10px;}
  .kv-key{min-width:130px;}
  .fav-grid{grid-template-columns:1fr;}
  .help-grid{grid-template-columns:1fr;}
  .term-title{font-size:10px;}
}

.hidden-section{display:none;}
.reveal{animation:revealLine 0.12s ease both;}
@keyframes revealLine{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

.neofetch-block{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:0 24px;
  margin:4px 0;
}

.neo-art{
  color:var(--green);
  white-space:pre;
  line-height:1.35;
  font-size:13px;
  align-self:start;
}

.neo-info{display:flex;flex-direction:column;gap:2px;padding-top:2px;}

.rainbow-bar{
  display:flex;gap:3px;margin-top:8px;
}

.rb{
  flex:1;height:10px;border-radius:2px;
}

@media(max-width:480px){
  .neofetch-block{grid-template-columns:1fr;}
  .neo-art{display:none;}
}

.pyrophobic-wrap{
  position:relative;
  display:inline-block;
  color:#ff8c00;
  text-shadow:0 0 6px #ff6600,0 0 14px #ff4400,0 0 22px rgba(255,34,0,0.35);
  font-weight:500;
}
@media(min-width:601px){
  .fire-emoji{
    position:absolute;
    font-size:11px;
    bottom:100%;
    margin-bottom:1px;
    animation:fireRise 1.2s ease-in infinite;
    pointer-events:none;
    user-select:none;
    line-height:1;
  }
  .fire-emoji:nth-child(1){left:2%;animation-delay:0s;animation-duration:1.1s}
  .fire-emoji:nth-child(2){left:20%;animation-delay:0.28s;animation-duration:1.35s}
  .fire-emoji:nth-child(3){left:40%;animation-delay:0.55s;animation-duration:1.0s}
  .fire-emoji:nth-child(4){left:60%;animation-delay:0.12s;animation-duration:1.45s}
  .fire-emoji:nth-child(5){left:78%;animation-delay:0.72s;animation-duration:1.2s}
  @keyframes fireRise{
    0%{opacity:0;transform:translateY(0px) scale(0.6)}
    15%{opacity:1;transform:translateY(-3px) scale(1.0)}
    55%{opacity:0.85;transform:translateY(-11px) scale(0.85)}
    100%{opacity:0;transform:translateY(-22px) scale(0.4)}
  }
}
@media(max-width:600px){
  .pyrophobic-wrap{color:#ff8c00;text-shadow:none}
  .fire-emoji{display:none}
}
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="crt-glow"></div>

<div id="loading-screen">
  <div class="boot-logo" id="bootLogo">exi@terminal</div>
  <div class="boot-bar-wrap"><div class="boot-bar" id="bootBar"></div></div>
  <div class="boot-log" id="bootLog">initializing...</div>
</div>

<div id="terminal" style="display:none;">
  <div class="term-window">
    <div class="term-titlebar">
      <div class="term-dots">
        <div class="term-dot dot-red"></div>
        <div class="term-dot dot-yellow"></div>
        <div class="term-dot dot-green"></div>
      </div>
      <div class="term-title">exi@terminal:~ — bash</div>
    </div>
    <div class="term-body" id="termBody">
    </div>
  </div>
</div>

<script>
const isMobile = window.innerWidth <= 600 || ('ontouchstart' in window);

const BOOT_LOGS = [
  'loading kernel modules...',
  'mounting filesystems...',
  'starting udev daemon...',
  'bringing up network interfaces...',
  'loading user profile...',
  'initializing display...',
  'done.',
];

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function runBoot(){
  if(isMobile){
    document.getElementById('loading-screen').style.display='none';
    document.getElementById('terminal').style.display='block';
    await renderTerminal();
    return;
  }
  const bar=document.getElementById('bootBar');
  const log=document.getElementById('bootLog');
  let p=0;
  for(let i=0;i<BOOT_LOGS.length;i++){
    log.textContent=BOOT_LOGS[i];
    p=Math.min(100,Math.round((i+1)/BOOT_LOGS.length*100));
    bar.style.width=p+'%';
    await sleep(180+Math.random()*120);
  }
  await sleep(300);
  document.getElementById('loading-screen').classList.add('hidden');
  await sleep(650);
  document.getElementById('terminal').style.display='block';
  await renderTerminal();
}

const DISCORD_ID='750971511401218078';
let discordData=null;

function getAge(){
  const born=new Date(2008,0,1);
  const now=new Date();
  let age=now.getFullYear()-born.getFullYear();
  if(now<new Date(now.getFullYear(),0,1)) age--;
  return age;
}

function getStatusClass(s){
  return ['online','idle','dnd'].includes(s)?s:'offline';
}

function statusLabel(s){
  const m={online:'online',idle:'idle',dnd:'do not disturb',offline:'offline'};
  return m[s]||'offline';
}

function statusColor(s){
  const m={online:'var(--green)',idle:'var(--yellow)',dnd:'var(--red)',offline:'var(--gray)'};
  return m[s]||'var(--gray)';
}

const FAV_DATA=[
  {title:'Berserk',sub:'Manga',desc:"Miura's art blew me away. R.I.P Miura. Kouji Mori is continuing the story and I'm here for it regardless. Fuck you Griffith."},
  {title:'Attack On Titan',sub:'Anime',desc:'Peak. Rewatched in Feb 2026 and realised how much of a masterpiece it was. First watch in 2020 I thought it was mid. 10/10 must watch.'},
  {title:'The Walking Dead',sub:'Comic',desc:"Heard the comic was better than the show. First good comic I read. A bit fast-paced like Kirkman's other works, but emotionally deep."},
  {title:'Breaking Bad',sub:'TV Show',desc:'"Waltuh." Jokes aside, fully deserves every award. A masterpiece. Also considering a rewatch.'},
  {title:'The Stray Cat',sub:'Animal',desc:"The neighbourhood stray I don't see anymore. Used to feed it but wasn't allowed inside. He was a good fella. Rocked me bollocks off."},
  {title:'Detroit: Become Human',sub:'Video Game',desc:'Got the bad ending and just stared at the ceiling in silence. Not crying. Just... failing my duty. Must play.'},
];

const LOVED_MEDIA=[
  {name:'The Boys',url:'https://letmegooglethat.com/?q=The+Boys+TV+show'},
  {name:'Supernatural',url:'https://letmegooglethat.com/?q=Supernatural+TV+show'},
  {name:'Malcolm in the Middle',url:'https://letmegooglethat.com/?q=Malcolm+in+the+Middle'},
  {name:"JoJo's Bizarre Adventure",url:"https://letmegooglethat.com/?q=JoJo%27s+Bizarre+Adventure"},
  {name:'Red Dead Redemption 2',url:'https://letmegooglethat.com/?q=Red+Dead+Redemption+2'},
  {name:'Resident Evil Games',url:'https://letmegooglethat.com/?q=Resident+Evil+games'},
];

const SOCIALS=[
  {name:'YouTube',url:'https://www.youtube.com/channel/UCwH2bC5lHdy8QUYA91SG1Fg',icon:'▶'},
  {name:'Discord',url:'https://discord.gg/jz2SAe8MvQ',icon:'▶'},
  {name:'Steam',url:'https://steamcommunity.com/id/moneymoneyrain/',icon:'▶'},
];

const term=document.getElementById('termBody');

function el(tag,cls,html){
  const e=document.createElement(tag);
  if(cls) e.className=cls;
  if(html!==undefined) e.innerHTML=html;
  return e;
}

function appendLine(html,cls='line'){
  const d=el('div',cls,html);
  term.appendChild(d);
  return d;
}

function appendPrompt(cmd){
  const d=document.createElement('div');
  d.className='line prompt-line';
  d.innerHTML=`<span class="p-user">exi</span><span class="p-at">@</span><span class="p-host">terminal</span><span class="p-colon">:</span><span class="p-path">~</span><span class="p-dollar"> $</span><span class="p-cmd"> ${cmd}</span>`;
  term.appendChild(d);
  return d;
}

function appendKV(key,valHTML){
  const d=document.createElement('div');
  d.className='line key-val';
  d.innerHTML=`<span class="kv-key">${key}</span><span class="kv-val">${valHTML}</span>`;
  term.appendChild(d);
  return d;
}

function appendGap(){appendLine('','line gap');}
function appendGap2(){appendLine('','line gap2');}

function appendComment(text){
  appendLine(`<span class="comment"># ${text}</span>`);
}

const NEO_ART=`  ███████╗██╗  ██╗██╗
  ██╔════╝╚██╗██╔╝██║
  █████╗   ╚███╔╝ ██║
  ██╔══╝   ██╔██╗ ██║
  ███████╗██╔╝ ██╗██║
  ╚══════╝╚═╝  ╚═╝╚═╝`;

const PYRO_HTML = 'I was once burned at the stake but im <span class="pyrophobic-wrap">pyrophobic</span> so i';

async function renderTerminal(){
  await sleep(isMobile?0:200);

  appendLine(`<span class="c-gray2">Last login: ${new Date().toDateString()} on ttys001</span>`,'line gap');

  appendPrompt('neofetch');
  await sleep(isMobile?0:120);

  const neo=document.createElement('div');
  neo.className='neofetch-block line gap2';
  neo.style.marginTop='8px';

  const artDiv=document.createElement('div');
  artDiv.className='neo-art';
  artDiv.textContent=NEO_ART;

  const infoDiv=document.createElement('div');
  infoDiv.className='neo-info';

  const statusDotId='neo-status-dot';
  const activityId='neo-activity';
  const statusTextId='neo-status-text';

  infoDiv.innerHTML=`
    <div><span class="c-green" style="font-weight:700">exi</span><span class="c-gray">@</span><span class="c-blue" style="font-weight:700">terminal</span></div>
    <div class="c-gray2">──────────────────</div>
    <div><span class="c-cyan">OS</span>       <span class="c-white">human/linux 6.9</span></div>
    <div><span class="c-cyan">Age</span>      <span class="age-display">${getAge()} (born 2008)</span></div>
    <div><span class="c-cyan">Gender</span>   <span class="c-white">he/him</span></div>
    <div><span class="c-cyan">Handle</span>   <span class="c-white">@moneymoneyrain</span></div>
    <div><span class="c-cyan">Status</span>   <span class="status-dot offline" id="${statusDotId}"></span><span id="${statusTextId}" style="color:var(--gray)">fetching...</span></div>
    <div><span class="c-cyan">Activity</span> <span id="${activityId}" class="c-gray typing-line">...</span></div>
    <div><span class="c-cyan">Badges</span>   <span class="c-yellow">Fake Gamer</span> <span class="c-gray">·</span> <span class="c-yellow">Fake Programmer</span> <span class="c-gray">·</span> <span class="c-yellow">Nerd</span></div>
    <div><span class="c-cyan">Scholar</span>  <span class="c-purple">of dorktown</span></div>
    <div class="rainbow-bar">
      <div class="rb" style="background:#ff5555"></div>
      <div class="rb" style="background:#ffb86c"></div>
      <div class="rb" style="background:#f1fa8c"></div>
      <div class="rb" style="background:#50fa7b"></div>
      <div class="rb" style="background:#8be9fd"></div>
      <div class="rb" style="background:#bd93f9"></div>
      <div class="rb" style="background:#ff79c6"></div>
      <div class="rb" style="background:#ff5555"></div>
    </div>
  `;

  neo.appendChild(artDiv);
  neo.appendChild(infoDiv);
  term.appendChild(neo);

  window._actLineTextEl=document.getElementById(activityId);
  window._actStatusDot2=document.getElementById(statusDotId);
  window._statusTextEl=document.getElementById(statusTextId);

  loadDiscord(statusDotId,activityId);

  await sleep(isMobile?0:80);

  appendPrompt('cat about.txt');
  await sleep(isMobile?0:80);

  const bioLines=[
    '__HTML__:' + PYRO_HTML,
    "didn't die.",
    '',
    "I write short books and make shorter games. I don't",
    'have a strong attachment to anything — I pick something',
    'up, lose interest, or commit for a week. Rinse, repeat.',
    '',
    'Very bored person. Please disturb me in my DMs.',
  ];

  const bioBlock=document.createElement('div');
  bioBlock.className='output-block line gap2';
  bioBlock.style.marginTop='6px';
  term.appendChild(bioBlock);

function appendInteractiveInput(){
  const wrap=document.createElement('div');
  wrap.className='input-line';
  wrap.id='input-wrap';
  wrap.innerHTML=`<span class="p-user">exi</span><span class="p-at">@</span><span class="p-host">terminal</span><span class="p-colon">:</span><span class="p-path">~</span><span class="p-dollar"> $</span>`;
  const inp=document.createElement('input');
  inp.type='text';
  inp.className='cmd-input';
  inp.id='cmdInput';
  inp.placeholder='type a command... (try: help)';
  inp.autocomplete='off';
  inp.spellcheck=false;
  wrap.appendChild(inp);
  term.appendChild(wrap);
  inp.addEventListener('keydown',handleCommand);
  if(!isMobile) setTimeout(()=>inp.focus({preventScroll:true}),100);
}

const CMD_HISTORY=[];
let histIdx=-1;

const COMMANDS={
  help:cmdHelp,
  whoami:cmdWhoami,
  clear:cmdClear,
  ls:cmdLs,
  cat:cmdCat,
  neofetch:cmdNeofetch2,
  discord:cmdDiscord,
  socials:cmdSocials,
  favourites:cmdFavourites,
  works:cmdWorks,
  age:cmdAge,
  bio:cmdBio,
  exit:cmdExit,
};

const ALIASES={
  fav:'favourites',
  faves:'favourites',
  favorite:'favourites',
  social:'socials',
  work:'works',
  about:'bio',
  status:'discord',
  '?':'help',
};

function handleCommand(e){
  if(e.key==='Enter'){
    const raw=e.target.value.trim();
    e.target.value='';
    histIdx=-1;
    if(!raw) return;
    CMD_HISTORY.unshift(raw);

    const wrap=document.getElementById('input-wrap');
    if(wrap) wrap.remove();

    appendPrompt(escHtml(raw));
    appendGap();

    const parts=raw.toLowerCase().split(/\s+/);
    let cmd=parts[0];
    if(ALIASES[cmd]) cmd=ALIASES[cmd];

    const fn=COMMANDS[cmd];
    if(fn){
      fn(parts.slice(1));
    } else {
      appendLine(`<span class="error-line">bash: ${escHtml(parts[0])}: command not found</span>`);
      appendLine('<span class="c-gray2">Try <span class="c-yellow">help</span> for available commands.</span>');
    }

    appendGap();
    appendInteractiveInput();
    setTimeout(()=>{
      const ni=document.getElementById('cmdInput');
      if(ni && !isMobile) ni.focus({preventScroll:true});
    },50);
  }

  if(e.key==='ArrowUp'){
    e.preventDefault();
    if(histIdx<CMD_HISTORY.length-1) histIdx++;
    e.target.value=CMD_HISTORY[histIdx]||'';
  }
  if(e.key==='ArrowDown'){
    e.preventDefault();
    if(histIdx>0) histIdx--;
    else histIdx=-1;
    e.target.value=histIdx>=0?CMD_HISTORY[histIdx]:'';
  }
  if(e.key==='Tab'){
    e.preventDefault();
    const val=e.target.value.toLowerCase().trim();
    const all=[...Object.keys(COMMANDS),...Object.keys(ALIASES)];
    const match=all.find(c=>c.startsWith(val)&&c!==val);
    if(match) e.target.value=match;
  }
}

  } else if(dir==='favourites'||dir==='fav'){
    cmdFavourites();
  } else if(dir==='works'){
    cmdWorks();
  } else if(dir==='media'||dir==='loved'){
    appendLine(LOVED_MEDIA.map(m=>`<span class="c-cyan">${m.name}</span>`).join('  '));
  } else {
    appendLine(`<span class="error-line">ls: cannot access '${escHtml(args[0]||'')}': No such file or directory</span>`);
  }
}

function cmdCat(args){

    appendLine('<span class="error-line">cat: missing operand</span>');
    appendLine('<span class="c-gray2">Usage: cat <file>  (about.txt / status.txt / socials.txt)</span>');
  } else {

  }
}

function getActivityText(d){

  if(rich) return '🎮 '+rich.name;
  if(custom&&custom.state) return custom.state;
  return statusLabel(d.discord_status||'offline');
}

function loadDiscord(dot1id,act1id){
  function applyToNeo(d){
    discordData=d;
    const s=getStatusClass(d.discord_status||'offline');
    const act=getActivityText(d);
    const dot1=document.getElementById(dot1id);
    const act1=document.getElementById(act1id);
    if(dot1) dot1.className='status-dot '+s;
    if(act1){
      act1.style.color=statusColor(s);
      act1.textContent=statusLabel(s)+(act&&act!==statusLabel(s)?' — '+act:'');
    }
    syncActivity(d,s);
  }

  function syncActivity(d,s){
    const act=getActivityText(d);
    const isOffline=(s==='offline');
    if(window._statusTextEl){
      window._statusTextEl.style.color=statusColor(s);
      window._statusTextEl.textContent=statusLabel(s);
    }
    if(window._actStatusDot2){
      window._actStatusDot2.className='status-dot '+s;
    }
    if(window._actLineTextEl){
      if(!isOffline){
        window._typingPaused=true;
        window._actLineTextEl.style.color=statusColor(s);
        window._actLineTextEl.textContent=act&&act!==statusLabel(s)?act:statusLabel(s);
      } else {
        window._typingPaused=false;
        window._actLineTextEl.style.color='var(--gray)';
      }
    }
  }

  fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`)
    .then(r=>r.json())
    .then(j=>{if(j.success) applyToNeo(j.data);})
    .catch(()=>{});

  function wsConnect(){
    const ws=new WebSocket('wss://api.lanyard.rest/socket');
    let hb;
    ws.addEventListener('message',e=>{
      const msg=JSON.parse(e.data);
      if(msg.op===1){
        hb=setInterval(()=>ws.send(JSON.stringify({op:3})),msg.d.heartbeat_interval);
        ws.send(JSON.stringify({op:2,d:{subscribe_to_id:DISCORD_ID}}));
      }
      if(msg.op===0) applyToNeo(msg.d);
    });
    ws.addEventListener('close',()=>{clearInterval(hb);setTimeout(wsConnect,5000);});
    ws.addEventListener('error',()=>ws.close());
  }
  wsConnect();
}

function startTypingEffect(){
  const el=window._actLineTextEl;
  if(!el) return;
  const phrases=[
    'wow such activity',
    'much presence',
    'mouthwashing is a good game'
  ];
  let pi=0,ci=0,deleting=false,paused=false;
  window._typingPaused=false;

  function tick(){
    if(window._typingPaused){setTimeout(tick,300);return;}
    const phrase=phrases[pi%phrases.length];
    if(!deleting){
      ci++;
      el.textContent=phrase.slice(0,ci);
      if(ci===phrase.length){deleting=true;setTimeout(tick,2200);return;}
      setTimeout(tick,52+Math.random()*38);
    } else {
      ci--;
      el.textContent=phrase.slice(0,ci);
      if(ci===0){deleting=false;pi=(pi+1)%phrases.length;setTimeout(tick,420);return;}
      setTimeout(tick,28+Math.random()*18);
    }
  }

  setTimeout(tick,1200);
}
